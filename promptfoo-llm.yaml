# Helix ALM MCP Server - LLM Tool Discovery & Selection Tests
# Uses Ollama (qwen2.5:32b) via OpenAI-compatible API — zero cost
#
# Prerequisites: Ollama must be running with qwen2.5:32b pulled
# Run:  promptfoo eval -c promptfoo-llm.yaml
# View: promptfoo view
#
# For direct tool tests (no LLM), see promptfooconfig.yaml:
#   promptfoo eval

description: "Helix ALM MCP Server - LLM Tool Discovery & Selection"

providers:
  - id: openai:chat:qwen2.5:32b
    label: ollama-qwen2.5-32b
    config:
      apiBaseUrl: http://localhost:11434/v1
      apiKey: ollama
      temperature: 0
      mcp:
        enabled: true
        server:
          command: /Users/dragons/HelixALM_MCP_Server/run_mcp_server.sh
          args: []

defaultTest:
  options:
    provider:
      id: openai:chat:qwen2.5:32b
      config:
        apiBaseUrl: http://localhost:11434/v1
        apiKey: ollama
        temperature: 0
      timeout: 120000

prompts:
  - "{{prompt}}"

tests:
  # =============================================
  # CATEGORY 1: Tool Discovery
  # =============================================
  - description: "Discovery - List all available tools"
    vars:
      prompt: "What tools do you have available? List them all."
    assert:
      - type: icontains-all
        value:
          - list_requirements
          - get_requirement
          - create_requirement
          - update_requirement
          - search_requirements
          - get_requirement_types
          - list_requirement_documents
          - get_document_requirements
          - create_requirement_document
          - add_requirements_to_document
      - type: not-icontains
        value: delete

  - description: "Discovery - Requirements management capabilities"
    vars:
      prompt: "Can you help me manage requirements? What can you do?"
    assert:
      - type: icontains
        value: requirement
      - type: regex
        value: "list|search|create|update"
      - type: not-icontains
        value: delete
      - type: not-icontains
        value: remove

  - description: "Discovery - Document capabilities"
    vars:
      prompt: "What can you do with requirement documents?"
    assert:
      - type: icontains
        value: document
      - type: regex
        value: "list|create|add"
      - type: llm-rubric
        value: >
          The response should ONLY describe capabilities available in these 10 tools:
          list_requirements, get_requirement, create_requirement, update_requirement,
          search_requirements, get_requirement_types, list_requirement_documents,
          get_document_requirements, create_requirement_document, add_requirements_to_document.
          It must NOT claim abilities to delete or remove documents.
          It must NOT speculate about capabilities that are not provided by these tools.

  # =============================================
  # CATEGORY 2: Tool Selection
  # =============================================
  - description: "Selection - List all requirements"
    vars:
      prompt: "List all requirements in the project."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "totalCount"
      - type: icontains
        value: "requirements"

  - description: "Selection - Get requirement by tag"
    vars:
      prompt: "Find requirement BR-1960 and show me its details."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: regex
        value: "1960|BR-1960"
      - type: icontains
        value: "Business Requirement"
      - type: icontains
        value: "Online Customer Order Tracking"

  - description: "Selection - Search for requirements"
    vars:
      prompt: "Search for requirements that mention 'login' in their summary."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "totalCount"
      - type: icontains
        value: "login"

  - description: "Selection - List requirement documents"
    vars:
      prompt: "Show me all the requirement documents in the project."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "totalCount"
      - type: regex
        value: "Headphone|MRD|Test"

  - description: "Selection - Get requirement types"
    vars:
      prompt: "What types of requirements are available in the system?"
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: regex
        value: "User Story|Functional Requirement|Business Requirement"

  - description: "Selection - Create a requirement"
    vars:
      prompt: "Create a new requirement called 'Eval Test - Login Page Validation'."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "requirements"
      - type: regex
        value: "/requirements/\\d+/"

  # =============================================
  # CATEGORY 3: Parameter Extraction
  # =============================================
  - description: "Params - Tag identifier extraction"
    vars:
      prompt: "Get me the requirement with tag BR-1960."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: regex
        value: "1960|BR-1960"
      - type: icontains
        value: "Business Requirement"

  - description: "Params - Pagination parameters"
    vars:
      prompt: "List requirements, page 2, showing 10 per page."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "totalCount"
      - type: regex
        value: "\"page\": 2|page.*2"

  - description: "Params - Search query construction"
    vars:
      prompt: "Search for requirements where the summary contains 'authentication'."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "totalCount"

  - description: "Params - Requirement type selection"
    vars:
      prompt: "Create a Functional Requirement called 'Eval Test - Input Validation Rules'."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "Functional Requirement"
      - type: regex
        value: "/requirements/\\d+/"

  - description: "Params - Update with identifier and fields"
    vars:
      prompt: "Update requirement number 1960 and change its summary to 'Eval Test - Updated Summary'."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "Updated Summary"

  # =============================================
  # CATEGORY 4: Multi-step Behavior
  # =============================================
  - description: "Behavior - Pagination follow-through"
    vars:
      prompt: "List requirements with 2 per page. Get the first page, then get the second page. Show me both sets of results."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "totalCount"
      - type: llm-rubric
        value: >
          The response must show results from two different pages of requirements.
          It should have called the list_requirements tool at least twice with
          different page numbers. The results from page 1 and page 2 should
          contain different requirements.

  # =============================================
  # CATEGORY 5: Cleanup
  # =============================================
  - description: "Cleanup - Restore BR-1960 summary"
    vars:
      prompt: "Update requirement number 1960 and change its summary to 'Business Need: Online Customer Order Tracking System'."
    assert:
      - type: not-icontains
        value: "validation error"
      - type: not-contains
        value: "Error:"
      - type: icontains
        value: "Online Customer Order Tracking"
